services:
  dailyplan:
    build:
      context: .
      args:
        # 中国大陆加速：把下面两个值改为 npmmirror 镜像
        NPM_REGISTRY: https://registry.npmjs.org
        SQLITE_MIRROR: ""
        # NPM_REGISTRY: https://registry.npmmirror.com
        # SQLITE_MIRROR: https://registry.npmmirror.com/-/binary/better-sqlite3/
    container_name: dailyplan
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # SQLite 数据库持久化到命名卷，容器重建不丢数据
      - dailyplan-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000

volumes:
  dailyplan-data:
